<text class="mono" x="1890" y="350" font-size="15" fill="#FFFFFF">/payerb/outbound</text>

<text class="body" x="1890" y="540" fill="#FFD9D4" font-weight="600">writes &#8594; 403</text>

<path d="M550,696 L550,606" fill="none" stroke="#7B61C4" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arP)"/>
<path d="M2025,696 L2025,606" fill="none" stroke="#7B61C4" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arP)"/>

<rect x="380" y="700" width="1820" height="140" rx="14" fill="#F5F2FB" stroke="#C9BDE6"/>
<text class="glab" x="410" y="734" fill="#5B44A8">MICROSOFT ENTRA ID</text>
<text x="410" y="772" font-size="17" fill="#3F3268">One app registration per payer. That is the only credential they hold &#8212; no keys, no shared secrets, no storage account access.</text>
<text x="410" y="806" font-size="17" fill="#3F3268" font-weight="600">Zero Azure RBAC role assignments on the FHIR services. Only API Management&#8217;s managed identity is a FHIR Data Contributor.</text>

<!-- ============ bottom row ============ -->
<rect x="60" y="880" width="1210" height="150" rx="14" fill="#F0F8F2" stroke="#B7DCC1"/>
<text class="glab" x="90" y="914" fill="#2E7D4F">OBSERVABILITY</text>
<text x="90" y="952" font-size="16" fill="#274F38">Log Analytics + Application Insights &#183; AHDS AuditLogs &#183; APIM GatewayLogs &#183; StorageBlobLogs.</text>
<text x="90" y="982" font-size="16" fill="#274F38">Every call is attributed to a payer app registration and a contract, on both sides of the gateway.</text>
<text x="90" y="1012" font-size="16" fill="#4E7A60" font-style="italic">The audit trail is the evidence, not the assertion.</text>

<rect x="1320" y="880" width="1210" height="150" rx="14" fill="#FDF2F1" stroke="#EFB9B2"/>
<text class="glab" x="1350" y="914" fill="#B3261E">THE KEYSTONE &#8212; WHY THE GATEWAY CANNOT BE BYPASSED</text>
<text x="1350" y="952" font-size="16" fill="#5C1F19">A payer&#8217;s token is real and correctly audienced for its own FHIR service. Sent straight to that</text>
<text x="1350" y="982" font-size="16" fill="#5C1F19">service it still returns <tspan font-weight="700">403</tspan>, because the app registration holds no Azure role at all.</text>
<text x="1350" y="1012" font-size="16" fill="#8A3A31" font-style="italic">Proven live as assertion 12 of 15 in run-isolation-tests.ps1.</text>
